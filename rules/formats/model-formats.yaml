# Model file formats. A rule with the key of a built-in replaces it; a new key adds one.
# Exported from gangmu's built-in table; tests/test_rules.py keeps the two the same.
formats:
  - key: gguf
    name: 'GGUF'
    suffixes: ['.gguf']
    magic: {offset: 0, ascii: 'GGUF'}
  - key: tflite
    name: 'TensorFlow Lite'
    suffixes: ['.tflite']
    magic: {offset: 4, ascii: 'TFL3'}
  - key: executorch
    name: 'ExecuTorch'
    suffixes: ['.pte']
    magic: {offset: 4, ascii: 'ET12'}
  - key: onnx
    name: 'ONNX'
    suffixes: ['.onnx']
  - key: safetensors
    name: 'safetensors'
    suffixes: ['.safetensors']
  - key: pytorch
    name: 'PyTorch checkpoint'
    suffixes: ['.pt', '.pth', '.ckpt']
    note: 'Pickle-based format: loading it can run code. Prefer safetensors, or load it only from a source you trust.'
  - key: keras-h5
    name: 'Keras/HDF5'
    suffixes: ['.h5', '.keras', '.hdf5']
  - key: coreml
    name: 'Core ML'
    suffixes: ['.mlmodel']
  - key: rknn
    name: 'Rockchip RKNN'
    suffixes: ['.rknn']
  - key: mnn
    name: 'MNN'
    suffixes: ['.mnn']
  - key: ncnn-param
    name: 'ncnn model (text .param)'
    magic: {offset: 0, ascii: '7767517'}
    note: 'The .param file of an ncnn model; the weights are in a separate .bin file that gangmu does not tell apart from other binaries.'
  - key: onnxruntime-ort
    name: 'ONNX Runtime format'
    suffixes: ['.ort']
    magic: {offset: 4, ascii: 'ORTM'}
  - key: tnn
    name: 'Tencent TNN'
    suffixes: ['.tnnmodel', '.tnnproto']
  - key: tengine
    name: 'Tengine'
    suffixes: ['.tmfile']
  - key: nncase-kmodel
    name: 'Kendryte nncase (kmodel)'
    suffixes: ['.kmodel']
  - key: hailo-hef
    name: 'Hailo HEF'
    suffixes: ['.hef']
  - key: paddle
    name: 'PaddlePaddle inference model'
    suffixes: ['.pdmodel', '.pdiparams']
  - key: caffe
    name: 'Caffe model'
    suffixes: ['.caffemodel']
  - key: pickle
    name: 'Python pickle / joblib model'
    suffixes: ['.pkl', '.pickle', '.joblib']
    note: 'Pickle-based: loading it can run code. Load it only from a source you trust, or export the model to a data-only format.'
  - key: ggml
    name: 'ggml model (whisper.cpp and early llama.cpp)'
    magic: {offset: 0, ascii: 'lmgg'}
    note: 'The file starts with the 32-bit value 0x67676d6c written little-endian (GGML_FILE_MAGIC in whisper.cpp). GGUF replaced it for llama.cpp.'
  - key: esp-dl
    name: 'ESP-DL model'
    suffixes: ['.espdl']
  - key: sophgo-bmodel
    name: 'Sophgo BModel'
    suffixes: ['.bmodel']
  - key: pytorch-lite
    name: 'PyTorch Lite interpreter model'
    suffixes: ['.ptl']
    note: 'Written by _save_for_lite_interpreter for the PyTorch mobile runtime.'
